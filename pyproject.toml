[project]
name = "x402-identity-guard"
version = "0.1.0"
description = "Reference identity pre-filter for x402 servers, built on TRC-8004"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "starlette",
    "tronpy",
    # bankofai.sdk_8004 is not on PyPI — install separately:
    # pip install "git+https://github.com/BofAI/8004-sdk.git#subdirectory=python"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_identity_guard"]
